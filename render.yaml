services:
  - type: web
    name: allears
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Configure in Render Dashboard -> Environment using your Supabase Session Pooler URI (port 5432)
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

